# Cabeceras de seguridad comunes a TODO lo que sale del nginx de la app (páginas,
# API, redirecciones). Se incluye en el server y en CADA location que ponga sus
# propios add_header: en nginx, un add_header en una location REEMPLAZA todos los
# heredados del server. Olvidar el include en una location nueva es un hueco.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La web no usa ninguna de estas capacidades del navegador: todas negadas.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
