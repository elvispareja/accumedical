# La única fuente externa de toda la CSP es el servidor de teselas de
# OpenStreetMap, en img-src y nada más: el mapa de ubicación las carga como
# imágenes desde el NAVEGADOR. El servidor no hace ninguna petición saliente, así
# que A10/SSRF sigue sin aplicar. Leaflet se sirve desde el bundle propio, nunca
# desde una CDN, para que script-src y style-src se queden en 'self'.
#
# En nginx, un add_header en un nivel inferior REEMPLAZA todos los heredados del
# nivel superior. Como cada location necesita su propio Cache-Control, estas
# cabeceras se declaran aquí y se incluyen DENTRO de cada location. Añadir una
# location sin este include es un bug de seguridad silencioso.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
