# Las PÁGINAS de las apps (admin, concurrencia, pacientes) servidas por el
# servidor de DESARROLLO de Vite, que es lo que corre en el laboratorio.
include /etc/nginx/includes/cabeceras-comunes.conf;

# CSP IMPUESTA (no solo informe). Diferencias con la de producción
# (security-headers.conf), ambas exigidas por el servidor de desarrollo:
#   · script-src: además de 'self', los HASH de los dos scripts en línea del
#     index.html servido —el que aplica el tema antes de pintar y el preámbulo
#     de React Refresh de Vite—. Nada de 'unsafe-inline' para scripts.
#     Si cambia el script del tema (index.html) o la versión de Vite, cambian
#     los hash: recalcularlos (docs/10-frontends.md) o las apps quedan en blanco.
#   · style-src 'unsafe-inline': Vite en desarrollo inyecta el CSS como <style>
#     desde JS. En producción el CSS es un archivo y se quita.
#   · connect-src: el websocket de recarga en caliente (HMR).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk=' 'sha256-iH2r+rziGUMxW4T/x7g0xqclsWVqnGm+lFLUzaH7yKM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' wss://$host ws://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
