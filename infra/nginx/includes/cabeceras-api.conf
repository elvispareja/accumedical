# La API (/api/…). El backend ya pone nosniff, DENY, Referrer-Policy y
# Cache-Control: no-store; aquí van las comunes (mismos valores) y una CSP que
# solo impide incrustarla. Sin default-src 'none' a propósito: el informe final
# compartido (D3) es un PDF que se abre en el visor del navegador.
include /etc/nginx/includes/cabeceras-comunes.conf;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
# Una sola fuente por cabecera: las que también pone el backend se ocultan para
# que no salgan duplicadas (los escáneres marcan duplicados y X-Frame-Options
# repetido es ambiguo para algunos navegadores).
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
