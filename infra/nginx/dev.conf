map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A04: primera capa de rate limiting, antes de que la petición toque la aplicación.
# Es la única capa que sobrevive a un reinicio del proceso de la API.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Misma CSP que producción pero en modo informe: las violaciones aparecen en la
    # consola del navegador durante el desarrollo, no en el peor momento del despliegue.
    # ws://localhost:8080 es el websocket de HMR de Vite, que en producción no existe.
    # Las teselas de OpenStreetMap sí están en las dos: el mapa de ubicación las
    # carga como imágenes desde el navegador.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ws://localhost:8080; object-src 'none'; frame-ancestors 'none'" always;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/includes/proxy-api.inc;
        proxy_pass http://api:8000;
    }

    # proxy_pass SIN URI final: la ruta llega intacta a FastAPI, que ya monta /api/v1.
    # Cero rewrites y ninguna sorpresa con la barra final.
    location /api/ {
        include /etc/nginx/includes/proxy-api.inc;
        proxy_pass http://api:8000;
    }

    # La app de CONCURRENCIA tiene su propio frontend (D46): todo /concurrencia/…
    # —páginas, su código y su websocket de HMR— va a su servidor. Sin la barra
    # final se redirige con ella (relativo: detrás hay túneles y proxies).
    absolute_redirect off;
    location = /concurrencia {
        return 302 /concurrencia/$is_args$args;
    }
    location /concurrencia/ {
        proxy_pass http://web-concurrencia:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Vite dev server (admin y todo lo que no sea de un módulo con app propia).
    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;                          # obligatorio para websockets
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;   # el ws de HMR es de larga vida; sin esto nginx lo corta a los 60 s
        proxy_send_timeout 86400s;
    }
}
