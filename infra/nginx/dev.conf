# Qué frontend sirve cada petición (D46, D48). Cada módulo con app propia la
# tiene en la RAÍZ de su subdominio (concurrencia.pymes.ec/dashboard); en local,
# sin subdominios, bajo /concurrencia/. Todo lo demás es la app de admin.
map "$host$uri" $frontend {
    default                                           web:5173;
    "~^concurrencia\."                                web-concurrencia:5174;
    "~^(localhost|127\.0\.0\.1)/concurrencia(/|$)"   web-concurrencia:5174;
    "~^pacientes\."                                   web-pacientes:5175;
    "~^(localhost|127\.0\.0\.1)/pacientes(/|$)"      web-pacientes:5175;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A04: primera capa de rate limiting, antes de que la petición toque la aplicación.
# Es la única capa que sobrevive a un reinicio del proceso de la API.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Misma CSP que producción pero en modo informe: las violaciones aparecen en la
    # consola del navegador durante el desarrollo, no en el peor momento del despliegue.
    # ws://localhost:8080 es el websocket de HMR de Vite, que en producción no existe.
    # Las teselas de OpenStreetMap sí están en las dos: el mapa de ubicación las
    # carga como imágenes desde el navegador.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ws://localhost:8080; object-src 'none'; frame-ancestors 'none'" always;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/includes/proxy-api.inc;
        proxy_pass http://api:8000;
    }

    # proxy_pass SIN URI final: la ruta llega intacta a FastAPI, que ya monta /api/v1.
    # Cero rewrites y ninguna sorpresa con la barra final.
    location /api/ {
        include /etc/nginx/includes/proxy-api.inc;
        proxy_pass http://api:8000;
    }

    # `/concurrencia` sin barra → con barra (relativo: detrás hay túneles y proxies).
    absolute_redirect off;
    location = /concurrencia {
        return 302 /concurrencia/$is_args$args;
    }
    location = /pacientes {
        return 302 /pacientes/$is_args$args;
    }

    # El frontend que toca según `$frontend` (arriba), con su websocket de HMR.
    # proxy_pass con variable necesita el DNS interno de Docker.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;                          # obligatorio para websockets
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;   # el ws de HMR es de larga vida; sin esto nginx lo corta a los 60 s
        proxy_send_timeout 86400s;
    }
}
