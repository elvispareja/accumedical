[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# La URL NO se pone aquí: la construye env.py desde pydantic-settings, que ya
# validó las variables de entorno. Así no hay dos fuentes de verdad ni una
# contraseña en un archivo versionado.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
